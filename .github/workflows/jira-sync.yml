on:
  issues:
    types: [opened, closed]

permissions: {}

jobs:
  create-jira-issue:
    if: github.event.action == 'opened'
    permissions:
      issues: write # comment the Jira key on the GitHub issue
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Jira
        uses: atlassian/gajira-login@45fd029b9f1d6d8926c6f04175aa80c0e42c9026 # v3.0.1
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

      - name: Create Issue in Jira
        id: create_jira
        uses: atlassian/gajira-create@59e177c4f6451399df5b4911c2211104f171e669 # v3.0.1
        with:
          project: QSI
          issuetype: Task
          summary: "${{ github.event.issue.title }}"
          description: |
            GitHub Issue: ${{ github.event.issue.html_url }}
            Author: ${{ github.event.issue.user.login }}

            ${{ github.event.issue.body }}

      - name: Comment Jira Key on GitHub Issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          JIRA_ISSUE: ${{ steps.create_jira.outputs.issue }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
        with:
          script: |
            const { JIRA_ISSUE, JIRA_BASE_URL } = process.env;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Tracked in Jira: [${JIRA_ISSUE}](${JIRA_BASE_URL}/browse/${JIRA_ISSUE})`
            })

  close-jira-issue:
    if: github.event.action == 'closed'
    permissions:
      issues: read # read the Jira key from the issue comments
    runs-on: ubuntu-latest
    steps:
      - name: Find Jira key in issue comments
        id: key
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const c of comments) {
              const m = c.body.match(/Tracked in Jira: \[([A-Z]+-\d+)\]/);
              if (m) { core.setOutput('key', m[1]); return; }
            }
            core.setFailed('No Jira key found in the issue comments');

      - name: Login to Jira
        uses: atlassian/gajira-login@45fd029b9f1d6d8926c6f04175aa80c0e42c9026 # v3.0.1
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

      - name: Move Jira item to Done
        uses: atlassian/gajira-transition@38fc9cd61b03d6a53dd35fcccda172fe04b36de3 # v3.0.1
        with:
          issue: ${{ steps.key.outputs.key }}
          transition: Done
