[project]
name = "bqp-api"
version = "0.1.4"
authors = [
    {name = "Martin Ruefenacht", email = "martin.ruefenacht@lrz.de"},
]
requires-python = ">=3.10"
dependencies = [
    "flask>=2.3",
    "pony>=0.7",
    "bqp-database-access>=0.2",
]
description = ""
readme = "README.md"

[tool.pdm.dev-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-env>=0.8.2",
]

[tool.pytest.ini_options]
env = [
    "QUANTUM_DB_TESTING=TRUE",
    "QUANTUM_DB_FILENAME=test_db.sqlite",
    "QUANTUM_DB_USER=",
    "QUANTUM_DB_PASS=",
    "QUANTUM_DB_HOST="
]
pythonpath = ["."]
