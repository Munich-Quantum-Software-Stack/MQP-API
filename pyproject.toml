[project]
name = "BQP API"
version = "0.1"
description = "The BQP API provides programmatic and external access to the Bavarian Quantum resources."
authors = [
    {name = "Martin Ruefenacht", email = "martin.ruefenacht@lrz.de"},
]
dependencies = [
    "pony>=0.7.16",
    "flask>=2.2.2",
    "psycopg2-binary>=2.9.5",
    "psycopg2>=2.9.5",
    "psycopg2cffi>=2.9.0",
    "qiskit>=0.39.2",
    "BQP-Database-Access @ git+ssh://git@gitlab-int.srv.lrz.de/lrz-qct-qis/bavarian-quantum-portal/bqp-database-access.git@develop",
]
requires-python = ">=3.10"
license = {text = "MIT"}
[project.optional-dependencies]

[build-system]
requires = ["pdm-pep517>=1.0.0"]
build-backend = "pdm.pep517.api"

[tool]
[tool.pdm]
[tool.pdm.dev-dependencies]
dev = [
    "black>=22.10.0",
    "mypy>=0.982",
]
