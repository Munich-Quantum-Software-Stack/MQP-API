[project]
name = "bqp-api"
version = "0.1.5"
authors = [
    {name = "Martin Ruefenacht", email = "martin.ruefenacht@lrz.de"},
]
requires-python = ">=3.10,<3.12"
dependencies = [
    "flask>=2.3",
    "pony>=0.7",
    "eliot[journald]>=1.15.0",
    "bqp-database-access>=0.2.21",
    "gunicorn>=21.2.0",
]
description = ""
readme = "README.md"

[tool.pdm.dev-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-env>=0.8.2",
]

[tool.pytest.ini_options]
env = [
    "QUANTUM_DB_TESTING=TRUE",
    "QUANTUM_DB_FILENAME=test_db.sqlite",
    "QUANTUM_DB_USER=",
    "QUANTUM_DB_PASS=",
    "QUANTUM_DB_HOST="
]
pythonpath = ["."]

[[tool.pdm.source]]
name = "lrz_pypi"
url = "http://pypi.quantum.lrz.de:8080/"
verify_ssl = false
