[project]
name = "bqp-api"
version = "0.2.1"
authors = [
    {name = "Martin Ruefenacht", email = "martin.ruefenacht@lrz.de"},
]
requires-python = ">=3.10,<3.12"
dependencies = [
    "flask>=2.3",
    "pony>=0.7",
    "eliot[journald]>=1.15.0",
    "bqp-database-access>=0.3.1",
    "gunicorn>=21.2.0",
]
description = ""
readme = "README.md"

[project.optional-dependencies]
dev = [
    "black>=25.1.0",
    "isort>=6.0.0",
    "mypy>=1.14.1",
    "pylint>=3.3.4",
    "pre-commit>=4.1.0",
]

[tool.pdm.dev-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-env>=0.8.2",
]

[tool.pylint.'MESSAGES CONTROL']
disable = [
    "too-many-arguments",
    "too-many-nested-blocks",
    "too-few-public-methods",
    "too-many-instance-attributes",
    "too-many-branches",
    "too-many-function-args",
    "W0511",
    "W0718",
    "import-outside-toplevel",
    "missing-docstring",
]

[tool.pytest.ini_options]
env = [
    "QUANTUM_DB_TESTING=TRUE",
    "QUANTUM_DB_FILENAME=test_db.sqlite",
    "QUANTUM_DB_USER=",
    "QUANTUM_DB_PASS=",
    "QUANTUM_DB_HOST="
]
pythonpath = ["."]

[[tool.pdm.source]]
name = "lrz_pypi"
url = "http://pypi.quantum.lrz.de:8080/"
verify_ssl = false
